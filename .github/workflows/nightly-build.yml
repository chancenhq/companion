name: Nightly Build

on:
  schedule:
    # Runs at 02:00 UTC every night. The job dispatches a full build only
    # when PRs were merged into the target branch during the lookback window.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to inspect and build
        required: true
        default: companion
      lookback_hours:
        description: Hours to look back for merged PRs
        required: true
        default: '24'
      dry_run:
        description: Check recent merges without dispatching the build
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  check-recent-merges:
    name: Check recent merged PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.merged_prs.outputs.should_build }}
      merged_count: ${{ steps.merged_prs.outputs.merged_count }}

    steps:
      - name: Find merged PRs in lookback window
        id: merged_prs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'companion' }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '24' }}
        run: |
          set -euo pipefail

          if ! [[ "$LOOKBACK_HOURS" =~ ^[0-9]+$ ]] || [ "$LOOKBACK_HOURS" -lt 1 ]; then
            echo "::error::lookback_hours must be a positive integer"
            exit 1
          fi

          SINCE_EPOCH="$(date -u -d "${LOOKBACK_HOURS} hours ago" +%s)"
          SINCE_ISO="$(date -u -d "@${SINCE_EPOCH}" +'%Y-%m-%dT%H:%M:%SZ')"

          echo "Looking for PRs merged into ${TARGET_BRANCH} since ${SINCE_ISO}"

          # The pulls API response can exceed the ~128 KiB Linux limit for a single
          # argv element, so JSON always reaches jq through temp files, never through
          # --argjson arguments.
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT
          MERGED_FILE="${WORKDIR}/merged.json"
          PAGE_FILE="${WORKDIR}/page.json"
          echo '[]' > "$MERGED_FILE"

          PAGE=1
          while true; do
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=closed \
              -f "base=${TARGET_BRANCH}" \
              -f sort=updated \
              -f direction=desc \
              -F per_page=100 \
              -F "page=${PAGE}" > "$PAGE_FILE"

            if [ "$(jq 'length' "$PAGE_FILE")" -eq 0 ]; then
              break
            fi

            # Keep only the fields the summary needs so the accumulator stays small.
            jq -cn \
              --slurpfile merged_prs "$MERGED_FILE" \
              --slurpfile page_prs "$PAGE_FILE" \
              --argjson since "$SINCE_EPOCH" \
              '$merged_prs[0] + [
                $page_prs[0][]
                | select(.merged_at != null and (.merged_at | fromdateiso8601) >= $since)
                | {number, title, merged_at}
              ]' > "${MERGED_FILE}.tmp"
            mv "${MERGED_FILE}.tmp" "$MERGED_FILE"

            # Results are ordered by updated_at descending. Once the oldest PR
            # on a page predates the window, later pages cannot contain a PR
            # merged during the window because merging updates the PR.
            OLDEST_UPDATED_EPOCH="$(jq -r '.[-1].updated_at | fromdateiso8601' "$PAGE_FILE")"
            if [ "$OLDEST_UPDATED_EPOCH" -lt "$SINCE_EPOCH" ]; then
              break
            fi

            PAGE=$((PAGE + 1))
          done

          jq 'sort_by(.merged_at) | reverse' "$MERGED_FILE" > "${MERGED_FILE}.tmp"
          mv "${MERGED_FILE}.tmp" "$MERGED_FILE"

          MERGED_COUNT="$(jq 'length' "$MERGED_FILE")"
          echo "merged_count=${MERGED_COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$MERGED_COUNT" -gt 0 ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## Nightly build check"
            echo
            echo "- Target branch: ${TARGET_BRANCH}"
            echo "- Lookback: ${LOOKBACK_HOURS} hours"
            echo "- Since: ${SINCE_ISO}"
            echo "- Merged PRs found: ${MERGED_COUNT}"
            echo
            if [ "$MERGED_COUNT" -gt 0 ]; then
              jq -r '.[] | "- #\(.number): \(.title) (\(.merged_at))"' "$MERGED_FILE"
            else
              echo "No merged PRs found. The build will not be dispatched."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch-build:
    name: Dispatch Build
    needs: check-recent-merges
    if: needs.check-recent-merges.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      - name: Dispatch full build workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'companion' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MERGED_COUNT: ${{ needs.check-recent-merges.outputs.merged_count }}
        run: |
          set -euo pipefail

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled. Would dispatch Publish Docker image (publish.yml) for ${TARGET_BRANCH}."
            exit 0
          fi

          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET_BRANCH" \
            -f ref="$TARGET_BRANCH" \
            -f push=true

          echo "Dispatched Publish Docker image (publish.yml) build for ${TARGET_BRANCH} after finding ${MERGED_COUNT} merged PR(s)."
